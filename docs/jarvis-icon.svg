<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="jarvisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jarvisRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jarvisCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle Dark Base -->
  <rect width="512" height="512" rx="110" fill="#090d16"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radial Glow Behind Arc Reactor -->
  <circle cx="256" cy="256" r="210" fill="url(#jarvisGlow)"/>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#0e7490" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#jarvisRing)" stroke-width="12" stroke-linecap="round" filter="url(#neonBlur)"/>

  <!-- Segmented Accents -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="45 25 70 25" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#0891b2" stroke-width="3" stroke-dasharray="15 15"/>

  <!-- Core Reactor Triangular Inset / Diamond Pulse -->
  <polygon points="256,160 338,304 174,304" fill="none" stroke="url(#jarvisCore)" stroke-width="10" stroke-linejoin="round" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="32" fill="url(#jarvisCore)" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="14" fill="#f0fdfa"/>

  <!-- Directional HUD ticks -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="432" x2="256" y2="462" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="256" x2="80" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="432" y1="256" x2="462" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
